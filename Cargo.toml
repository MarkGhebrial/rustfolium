[package]
edition = "2024"
name = "rustfolium"
version = "0.1.0"
authors = ["MarkGhebrial <mghebrialjr@icloud.com>"]
#rust-version = "stable"

[dependencies]
embassy-embedded-hal = { version = "0.6.0", features = [] }
embassy-sync = { version = "0.7.2", features = [] }
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = { version = "0.5.0", features = [] }
embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl", "rp2040", "executor-thread"] }
embassy-futures = { version = "0.1.2" }
embassy-usb = { version = "0.6.0", features = [] }
# embassy-usb-logger = { version = "0.5.1" }
# usbd-hid = "0.9.0"

# fixed = "1.31.0"
# fixed-macro = "1.2"

cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
# panic-probe = { version = "1.0", features = [] }
# futures = { version = "0.3.31", default-features = false, features = ["async-await", "cfg-target-has-atomic", "unstable"] }
heapless = "0.9.3"


embedded-hal-1 = { package = "embedded-hal", version = "=1.0.0" }
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-io-async = { version = "0.7.0", features = [] }
#embedded-storage = { version = "0.3" }
static_cell = "2"
portable-atomic = { version = "1.13", features = ["critical-section"] }
# log = "0.4"
# pio-proc = "0.4.0"
# pio = "0.4.0"
# rand = { version = "0.9.2", default-features = false }

# Display driver and graphics library
ssd1306 = { version = "0.10.0", features = ["async"] }
embedded-graphics = "0.8.2"

# Dshot protocol implementation
embassy-dshot = { git = "https://github.com/MarkGhebrial/embassy-dshot", branch = "main", features = ["rp2040"]}

[profile.release]
debug = 2

# Below configs are here to mute the rust-analyzer error.
# "Can't find crate for 'test'" as this is a no_std project
[[bin]]
name = "rustfolium"
test = false
bench = false
